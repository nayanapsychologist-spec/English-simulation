<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Journalist Bootcamp: Reporting Danger</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .locked-stage { filter: grayscale(1) opacity(0.5); pointer-events: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-amber-400">PRESS CORE: REPORTING DANGER</h1>
                <p class="text-xs text-slate-400 mt-1">Instructional Design Unit 11: Global News Reporting Simulation</p>
            </div>
            <div class="flex items-center gap-6 w-full md:w-auto justify-end">
                <div class="text-right">
                    <span class="text-xs uppercase tracking-wider text-slate-400">Score Tracker</span>
                    <div class="text-xl font-extrabold text-emerald-400" id="xp-counter">0 XP</div>
                </div>
                <div class="w-48 bg-slate-800 h-3 rounded-full overflow-hidden border border-slate-700">
                    <div id="global-progress" class="bg-gradient-to-r from-amber-500 to-emerald-500 h-full w-0 transition-all duration-500"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <section class="lg:grid-cols-1 lg:col-span-4 space-y-4">
            <div class="bg-slate-950 p-5 rounded-xl border border-slate-800">
                <h2 class="text-sm font-semibold tracking-wider uppercase text-slate-400 mb-4">Assignment Stages</h2>
                <div class="space-y-3" id="stages-list-container">
                    </div>
            </div>

            <div class="bg-slate-950 p-5 rounded-xl border border-slate-800 sticky top-28">
                <h2 class="text-sm font-semibold tracking-wider uppercase text-slate-400 mb-2">Live Teletype Feed</h2>
                <p class="text-xs text-slate-500 mb-3">Your running news copy compiles automatically below:</p>
                <div class="bg-slate-900 p-4 rounded border border-slate-800 font-mono text-xs text-amber-100/90 space-y-3 whitespace-pre-wrap min-h-[200px]" id="live-wire-preview">
                    <div class="text-slate-600 italic">[No copy drafted yet. Complete stages to transmit content.]</div>
                </div>
            </div>
        </section>

        <section class="lg:col-span-8 bg-slate-950 border border-slate-800 rounded-xl p-6 shadow-2xl min-h-[600px]">
            <div id="workspace-dynamic-content">
                </div>
        </section>
    </main>

    <script>
        // APPLICATION LEVEL ARCHITECTURE DATA (UNIT 11 MAPPED STATE)
        const appState = {
            xp: 0,
            currentStage: 1,
            maxUnlockedStage: 1,
            drafts: {
                headline: "",
                subheadline: "",
                leadParagraph: "",
                bodyParagraph: "",
                quotesParagraph: ""
            },
            stages: [
                {
                    id: 1,
                    title: "Headline & Wire Setup",
                    objective: "Master Journalistic Collocations to hook specific target audiences",
                    grammarConcept: "Targeted News Collocations",
                    instructions: "Before writing your headline, pass the editorial test on common weather collocations used by international correspondents.",
                    quiz: {
                        type: "matching",
                        question: "Match the natural disaster keyword to its textbook journalistic collocation:",
                        pairs: [
                            { word: "Temperatures", match: "soared" },
                            { word: "Baking", match: "heat" },
                            { word: "Roads", match: "melted" },
                            { word: "Water", match: "restrictions" }
                        ]
                    },
                    creative: {
                        prompt: "Write your Headline and Sub-headline for the European Heatwave. Make sure the headline captures attention (e.g., includes location) and the sub-headline offers a clear summary.",
                        fields: [
                            { id: "headline", label: "Main Headline (UPPERCASE preferred)", placeholder: "EUROPE HIT BY RECORD TEMPERATURES AS COUNTRIES FACE DROUGHT" },
                            { id: "subheadline", label: "Sub-Headline (Explanatory sentence)", placeholder: "Baking heat forces water restrictions across multiple administrative zones." }
                        ]
                    }
                },
                {
                    id: 2,
                    title: "The Inverted Lead",
                    objective: "Formulate core facts first using the Inverted Pyramid layout and the Passive Voice",
                    grammarConcept: "Passive Voice Tenses",
                    instructions: "Journalists utilize the passive voice to highlight *what happened to people or places* rather than focusing on the actor. Match the sentences to their correct passive tense.",
                    quiz: {
                        type: "mcq",
                        questions: [
                            {
                                text: "'All regional records have been shattered by the current heatwave.' Which passive tense is used?",
                                options: ["Past Simple Passive", "Present Perfect Passive", "Past Perfect Passive", "Present Continuous Passive"],
                                correct: 1,
                                exp: "Present Perfect Passive uses 'have/has been + past participle'."
                            },
                            {
                                text: "'Water supplies were cut off to agricultural zones early Tuesday.' Which passive tense is used?",
                                options: ["Past Simple Passive", "Future Simple Passive", "Present Conditional Passive", "Passive Infinitive"],
                                correct: 0,
                                exp: "Past Simple Passive uses 'was/were + past participle'."
                            }
                        ]
                    },
                    creative: {
                        prompt: "Draft your Lead Paragraph. You must include the core newsworthy metrics (What, Where, When, Who) and integrate at least one Passive Voice structure (e.g., 'was hit by', 'have been affected').",
                        fields: [
                            { id: "leadParagraph", label: "Lead Paragraph (Paragraph 1 - Core Facts)", placeholder: "Southern Europe was hit by unprecedented temperatures on Tuesday as several metropolitan areas have been affected by collapsing utility grids..." }
                        ]
                    }
                },
                {
                    id: 3,
                    title: "Analyzing the Scale",
                    objective: "Utilize emotive vocabulary and complex sentences to outline regional impact metrics",
                    grammarConcept: "Emotive Vocabulary & Scale",
                    instructions: "Select words that provoke immediate, strong emotional impact to accurately reflect the danger of a major global incident.",
                    quiz: {
                        type: "sorting",
                        question: "Identify the word that carries an intense, 'emotive' journalistic payload instead of a neutral one.",
                        items: [
                            { choice: "A 'bleak position' regarding water reserves", correct: true },
                            { choice: "A 'low amount' of water reserves", correct: false },
                            { choice: "A 'stunning turnaround' in local operations", correct: true },
                            { choice: "A 'noticeable change' in local operations", correct: false }
                        ]
                    },
                    creative: {
                        prompt: "Write your Body Paragraph details. Describe specific metrics of how the high temperatures impacted infrastructure, agriculture, and the regional populations.",
                        fields: [
                            { id: "bodyParagraph", label: "Infrastructure Impact (Paragraph 2)", placeholder: "As asphalt melted under the baking heat, rivers burst their banks due to sudden glacier recessions, throwing transit systems into a bleak position..." }
                        ]
                    }
                },
                {
                    id: 4,
                    title: "Witness Testimony & Sourcing",
                    objective: "Integrate direct quotations and reported speech to construct a multi-perspective balance",
                    grammarConcept: "Direct vs. Reported Speech Mechanics",
                    instructions: "Ensure direct quotes use proper punctuation marks and reported speech correctly drops the punctuation quotes when delivering the gist of an interaction.",
                    quiz: {
                        type: "mcq",
                        questions: [
                            {
                                text: "Identify the correct structure for a Direct Quotation:",
                                options: [
                                    "The meteorologist claimed that temperatures will climb higher.",
                                    "The meteorologist claimed, \"Temperatures will climb higher next week.\"",
                                    "The meteorologist claimed \"that temperatures will climb higher\""
                                ],
                                correct: 1,
                                exp: "Direct quotes use explicit speech marks enclosing the exact phrase spoken."
                            }
                        ]
                    },
                    creative: {
                        prompt: "Incorporate Quotes and Perspectives. Provide one direct quote from a climate official or emergency personnel, and one sentence of reported speech outlining what experts are recommending.",
                        fields: [
                            { id: "quotesParagraph", label: "Sourcing & Expert Testimony (Paragraph 3)", placeholder: "The Prime Minister stated, \"Emergency funds are being deployed immediately.\" Concurrently, meteorologists reported that conditions would remain static until Friday." }
                        ]
                    }
                },
                {
                    id: 5,
                    title: "Editorial Cohesion Review",
                    objective: "Apply cohesive relative and demonstrative reference pronouns for seamless flow",
                    grammarConcept: "Cohesive Pronoun References",
                    instructions: "Review how pronouns create a unified chain of reading experiences rather than disconnected, isolated events of text.",
                    quiz: {
                        type: "matching",
                        question: "Match the bolded pronoun reference token to its logical target anchor:",
                        pairs: [
                            { word: "Officials warned residents. **They** ordered evacuations.", match: "Officials" },
                            { word: "The heatwave hit towns. **Those** were left deserted.", match: "Towns" },
                            { word: "Deploying the emergency apparatus to protect **them**.", match: "Residents" }
                        ]
                    },
                    creative: {
                        prompt: "Your copy is nearly complete. Review your gathered work and add a final concluding sentence wrapping up the long-term outlook. Use cohesive references (e.g., 'this crisis', 'those affected').",
                        fields: [
                            { id: "closingSentence", label: "Final Concluding Line", placeholder: "Resolving this crisis will take weeks, but support for those affected is expanding across neighboring territories." }
                        ]
                    }
                }
            ]
        };

        // DOM ANCHORS
        const stagesContainer = document.getElementById("stages-list-container");
        const workspace = document.getElementById("workspace-dynamic-content");
        const liveWirePreview = document.getElementById("live-wire-preview");
        const xpCounter = document.getElementById("xp-counter");
        const globalProgressBar = document.getElementById("global-progress");

        // CORE RUNTIME FUNCTIONS
        function initializeApp() {
            renderMap();
            loadStage(appState.currentStage);
            updateGlobalUI();
        }

        function updateGlobalUI() {
            xpCounter.textContent = `${appState.xp} XP`;
            const completedCount = Object.values(appState.drafts).filter(x => x.trim().length > 0).length;
            const progressPct = Math.min(100, Math.floor((completedCount / 5) * 100));
            globalProgressBar.style.width = `${progressPct}%`;
            renderLiveTeletype();
        }

        function renderMap() {
            stagesContainer.innerHTML = "";
            appState.stages.forEach((stage) => {
                const isLocked = stage.id > appState.maxUnlockedStage;
                const isActive = stage.id === appState.currentStage;
                
                const card = document.createElement("button");
                card.className = `w-full text-left p-3 rounded-lg border transition-all text-sm flex items-start gap-3 ${
                    isLocked ? "locked-stage bg-slate-900/40 border-slate-800 text-slate-500" :
                    isActive ? "bg-amber-950/40 border-amber-500/80 text-amber-200 shadow shadow-amber-500/20" :
                    "bg-slate-900 hover:bg-slate-850 border-slate-800 text-slate-300"
                }`;
                
                card.onclick = () => {
                    if (!isLocked) {
                        appState.currentStage = stage.id;
                        renderMap();
                        loadStage(stage.id);
                    }
                };

                card.innerHTML = `
                    <div class="mt-0.5 flex-shrink-0 w-5 h-5 rounded-full flex items-center justify-center font-bold text-xs ${
                        isActive ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-400"
                    }">
                        ${stage.id}
                    </div>
                    <div>
                        <div class="font-bold flex items-center gap-2">
                            ${stage.title}
                            ${stage.id < appState.maxUnlockedStage ? " <span class='text-emerald-400 text-xs'>✓</span>" : ""}
                        </div>
                        <div class="text-xs text-slate-400 line-clamp-1 mt-0.5">${stage.objective}</div>
                    </div>
                `;
                stagesContainer.appendChild(card);
            });
        }

        function renderLiveTeletype() {
            let hasContent = false;
            let compiledText = "";

            if (appState.drafts.headline) {
                compiledText += `<h1 class="text-center font-black text-lg text-amber-400 uppercase tracking-tight">${appState.drafts.headline}</h1>\n`;
                hasContent = true;
            }
            if (appState.drafts.subheadline) {
                compiledText += `<p class="text-center font-semibold text-sm text-slate-300 italic max-w-xl mx-auto border-b border-slate-800 pb-3">${appState.drafts.subheadline}</p>\n\n`;
                hasContent = true;
            }
            if (appState.drafts.leadParagraph) {
                compiledText += `<p class="leading-relaxed text-sm drop-shadow"><span class="bg-amber-500 text-slate-950 font-bold px-1 rounded mr-1">DATELINE</span> ${appState.drafts.leadParagraph}</p>\n\n`;
                hasContent = true;
            }
            if (appState.drafts.bodyParagraph) {
                compiledText += `<p class="leading-relaxed text-sm text-slate-300">${appState.drafts.bodyParagraph}</p>\n\n`;
                hasContent = true;
            }
            if (appState.drafts.quotesParagraph) {
                compiledText += `<p class="leading-relaxed text-sm text-slate-300">${appState.drafts.quotesParagraph}</p>\n\n`;
                hasContent = true;
            }
            if (appState.drafts.closingSentence) {
                compiledText += `<p class="leading-relaxed text-sm text-slate-300 border-l-2 border-emerald-500 pl-3 italic">${appState.drafts.closingSentence}</p>\n`;
                hasContent = true;
            }

            if (!hasContent) {
                liveWirePreview.innerHTML = `<div class="text-slate-600 italic">[No copy drafted yet. Complete stages to transmit content.]</div>`;
            } else {
                liveWirePreview.innerHTML = compiledText;
            }
        }

        function loadStage(stageId) {
            const stage = appState.stages.find(s => s.id === stageId);
            let html = `
                <div class="space-y-4">
                    <div class="border-b border-slate-800 pb-4">
                        <span class="text-xs font-bold text-amber-400 uppercase tracking-widest bg-amber-950/60 border border-amber-900 px-2 py-1 rounded">Stage Objective ${stage.id} of 5</span>
                        <h2 class="text-2xl font-extrabold mt-2 text-slate-100">${stage.title}</h2>
                        <p class="text-slate-300 text-sm mt-1 font-medium"><strong class="text-amber-300">Target Objective:</strong> ${stage.objective}</p>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
                        <h3 class="text-xs uppercase font-bold text-slate-400 tracking-wider mb-1">Grammar & Conceptual Blueprint</h3>
                        <p class="text-sm text-slate-300">${stage.instructions}</p>
                    </div>

                    <div class="bg-slate-900/50 border border-slate-800 rounded-lg p-5" id="drill-box-container">
                        <div class="flex items-center justify-between mb-4">
                            <h4 class="text-sm font-bold text-amber-400 flex items-center gap-2">
                                <span>⚡ PHASE A: INTERACTIVE COPY-EDIT DRILL</span>
                            </h4>
                            <span class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-400 font-mono">+100 XP Challenge</span>
                        </div>
                        <div id="drill-interactive-payload"></div>
                        <div id="drill-feedback" class="mt-4 hidden p-3 rounded text-sm font-medium"></div>
                    </div>

                    <div class="bg-slate-900/20 border border-dashed border-slate-800 rounded-lg p-5 opacity-40 pointer-events-none transition-all duration-300" id="creative-box-container">
                        <h4 class="text-sm font-bold text-emerald-400 flex items-center gap-2 mb-3">
                            <span>✍️ PHASE B: CREATIVE WIRE PRODUCTION</span>
                        </h4>
                        <p class="text-xs text-slate-300 mb-4">${stage.creative.prompt}</p>
                        <div class="space-y-4">
            `;

            stage.creative.fields.forEach(f => {
                const val = appState.drafts[f.id] || "";
                html += `
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">${f.label}</label>
                        <textarea id="input-field-${f.id}" class="w-full bg-slate-950 border border-slate-800 rounded p-3 text-sm font-sans focus:outline-none focus:border-emerald-500 text-slate-100 placeholder-slate-700 h-24" placeholder="${f.placeholder}">${val}</textarea>
                    </div>
                `;
            });

            html += `
                        <button onclick="commitCreativeCopy(${stage.id})" class="mt-2 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold text-sm px-6 py-2.5 rounded shadow hover:from-emerald-500 hover:to-teal-500 transition-all flex items-center gap-2 cursor-pointer">
                            <span>Save Segment & Advance Wire</span>
                        </button>
                    </div>
                </div>
            `;

            workspace.innerHTML = html;
            injectStageDrill(stage);
        }

        function injectStageDrill(stage) {
            const container = document.getElementById("drill-interactive-payload");
            
            if (stage.quiz.type === "matching") {
                let itemsHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div><p class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Base Concept</p><div class="space-y-2">`;
                stage.quiz.pairs.forEach((p, idx) => {
                    itemsHTML += `<div class="bg-slate-900 p-2 text-sm font-mono border border-slate-800 rounded flex justify-between items-center">${p.word} 
                        <select id="match-select-${idx}" class="bg-slate-950 border border-slate-700 text-xs rounded p-1 text-amber-300 focus:outline-none">
                            <option value="">-- select --</option>
                            ${stage.quiz.pairs.map(opt => `<option value="${opt.match}">${opt.match}</option>`).join('')}
                        </select></div>`;
                });
                itemsHTML += `</div></div><div class="flex flex-col justify-between pt-6"><button onclick="verifyMatchingDrill(${stage.id})" class="w-full bg-amber-600 hover:bg-amber-500 font-bold text-xs py-2.5 rounded tracking-wide text-slate-950 cursor-pointer">VALIDATE MATCHES</button></div></div>`;
                container.innerHTML = itemsHTML;
            } 
            else if (stage.quiz.type === "mcq") {
                let itemsHTML = `<div class="space-y-4">`;
                stage.quiz.questions.forEach((q, qIdx) => {
                    itemsHTML += `<div><p class="text-sm text-slate-200 font-medium mb-2">${q.text}</p><div class="space-y-2">`;
                    q.options.forEach((opt, optIdx) => {
                        itemsHTML += `<label class="flex items-center gap-3 bg-slate-900/60 hover:bg-slate-900 border border-slate-800 rounded px-3 py-2 text-xs cursor-pointer">
                            <input type="radio" name="stage-mcq-${qIdx}" value="${optIdx}" class="text-amber-500 focus:ring-0">
                            <span>${opt}</span>
                        </label>`;
                    });
                    itemsHTML += `</div></div>`;
                });
                itemsHTML += `<button onclick="verifyMcqDrill(${stage.id})" class="bg-amber-600 hover:bg-amber-500 font-bold text-xs py-2.5 px-6 rounded tracking-wide text-slate-950 cursor-pointer">VERIFY RESPONSES</button></div>`;
                container.innerHTML = itemsHTML;
            }
            else if (stage.quiz.type === "sorting") {
                let itemsHTML = `<div class="space-y-3"><p class="text-xs font-semibold text-slate-400">${stage.quiz.question}</p><div class="grid grid-cols-1 gap-2">`;
                stage.quiz.items.forEach((item, idx) => {
                    itemsHTML += `<label class="flex items-center gap-3 bg-slate-900 border border-slate-800 rounded px-3 py-2 text-xs cursor-pointer">
                        <input type="checkbox" id="sort-check-${idx}" class="text-amber-500 focus:ring-0">
                        <span>${item.choice}</span>
                    </label>`;
                });
                itemsHTML += `</div><button onclick="verifySortingDrill(${stage.id})" class="bg-amber-600 hover:bg-amber-500 font-bold text-xs py-2.5 px-6 rounded tracking-wide text-slate-950 cursor-pointer">SUBMIT SELECTIONS</button></div>`;
                container.innerHTML = itemsHTML;
            }
        }

        // VERIFICATION PARSERS
        function unlockCreativePhase() {
            const creativeBox = document.getElementById("creative-box-container");
            creativeBox.classList.remove("opacity-40", "pointer-events-none");
            creativeBox.classList.add("bg-emerald-950/10", "border-emerald-800/40");
            creativeBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function triggerFeedback(isCorrect, text) {
            const box = document.getElementById("drill-feedback");
            box.classList.remove("hidden", "bg-emerald-900/40", "text-emerald-300", "bg-rose-900/40", "text-rose-300");
            box.classList.add("block", isCorrect ? "bg-emerald-900/40" : "bg-rose-900/40", isCorrect ? "text-emerald-300" : "text-rose-300");
            box.innerHTML = text;
        }

        window.verifyMatchingDrill = function(stageId) {
            const stage = appState.stages.find(s => s.id === stageId);
            let allCorrect = true;
            stage.quiz.pairs.forEach((p, idx) => {
                const el = document.getElementById(`match-select-${idx}`);
                if (el.value !== p.match) allCorrect = false;
            });

            if (allCorrect) {
                appState.xp += 100;
                triggerFeedback(true, "🎉 Copy-edit verified! Collocation chains verified by head editor. Creative Phase unlocked.");
                unlockCreativePhase();
                updateGlobalUI();
            } else {
                triggerFeedback(false, "❌ Incorrect pairing metrics. Look closely at standard combinations listed in the textbook documentation.");
            }
        };

        window.verifyMcqDrill = function(stageId) {
            const stage = appState.stages.find(s => s.id === stageId);
            let answersCorrect = true;
            let combinedExplanation = "";

            stage.quiz.questions.forEach((q, qIdx) => {
                const selected = document.querySelector(`input[name="stage-mcq-${qIdx}"]:checked`);
                if (!selected || parseInt(selected.value) !== q.correct) {
                    answersCorrect = false;
                }
                combinedExplanation += `<p class="mt-1">• ${q.exp}</p>`;
            });

            if (answersCorrect) {
                appState.xp += 100;
                triggerFeedback(true, `🎉 Sentence syntax verified. Objective accomplished!<br>${combinedExplanation}`);
                unlockCreativePhase();
                updateGlobalUI();
            } else {
                triggerFeedback(false, `❌ Syntax analysis failed check. Review the passive construction definitions before resubmitting.`);
            }
        };

        window.verifySortingDrill = function(stageId) {
            const stage = appState.stages.find(s => s.id === stageId);
            let perfect = true;

            stage.quiz.items.forEach((item, idx) => {
                const chk = document.getElementById(`sort-check-${idx}`).checked;
                if (chk !== item.correct) perfect = false;
            });

            if (perfect) {
                appState.xp += 100;
                triggerFeedback(true, "🎉 Emotive payload evaluated correctly! Creative module is now live.");
                unlockCreativePhase();
                updateGlobalUI();
            } else {
                triggerFeedback(false, "❌ Review your selections. Neutral vocabulary tracks information metrics without emotional payload tokens.");
            }
        };

        window.commitCreativeCopy = function(stageId) {
            const stage = appState.stages.find(s => s.id === stageId);
            stage.creative.fields.forEach(f => {
                const inputVal = document.getElementById(`input-field-${f.id}`).value;
                appState.drafts[f.id] = inputVal;
            });

            if (stageId === appState.stages.length) {
                renderFinalShowcase();
            } else {
                if (appState.maxUnlockedStage === stageId) {
                    appState.maxUnlockedStage++;
                }
                appState.currentStage = stageId + 1;
                renderMap();
                loadStage(appState.currentStage);
                updateGlobalUI();
            }
        };

        function renderFinalShowcase() {
            updateGlobalUI();
            renderMap();
            
            let draftSummaryText = "";
            if (appState.drafts.headline) draftSummaryText += `${appState.drafts.headline.toUpperCase()}\n`;
            if (appState.drafts.subheadline) draftSummaryText += `${appState.drafts.subheadline}\n\n`;
            if (appState.drafts.leadParagraph) draftSummaryText += `${appState.drafts.leadParagraph}\n\n`;
            if (appState.drafts.bodyParagraph) draftSummaryText += `${appState.drafts.bodyParagraph}\n\n`;
            if (appState.drafts.quotesParagraph) draftSummaryText += `${appState.drafts.quotesParagraph}\n\n`;
            if (appState.drafts.closingSentence) draftSummaryText += `${appState.drafts.closingSentence}`;

            workspace.innerHTML = `
                <div class="space-y-6">
                    <div class="border-b border-slate-800 pb-4 text-center">
                        <span class="text-xs font-bold text-emerald-400 uppercase tracking-widest bg-emerald-950 border border-emerald-900 px-3 py-1 rounded">Transmission Success</span>
                        <h2 class="text-3xl font-black mt-2 text-slate-100 tracking-tight">GLOBAL WIRE READY FOR PUBLICATION</h2>
                        <p class="text-slate-400 text-sm mt-1">Your incremental steps compiled flawlessly into a standard structured report.</p>
                    </div>
